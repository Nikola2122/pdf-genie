name: Lint and push to dockerhub

on:
  push:
    branches:
      - master

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend deps
        working-directory: ./frontend
        run: npm install

      - name: Run frontend lint (soft fail)
        working-directory: ./frontend
        run: npm run lint || echo "Lint warnings ignored"

  build-and-push:
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build backend image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/pdf-genie-backend:latest -f backend/Dockerfile .

      - name: Push backend image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/pdf-genie-backend:latest

      - name: Build frontend image
        run: docker build \
          --build-arg VITE_API_URL=${{ secrets.VITE_API_URL }} \
          -t ${{ secrets.DOCKER_USERNAME }}/pdf-genie-frontend:latest \
          ./frontend

      - name: Push frontend image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/pdf-genie-frontend:latest