apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pdf-genie-ingress
  namespace: pdf-genie
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: pdf-genie.local
      http:
        paths:
          - path: /frontend
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
